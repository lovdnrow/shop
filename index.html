  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 30px 0;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 25px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
      font-size: 24px;
    }

    p {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
    }

    /* SEARCH */
    #search {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid #ddd;
      margin-bottom: 22px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }

    #search:focus {
      border-color: #f2a6c9;
      box-shadow: 0 0 0 3px rgba(242, 166, 201, 0.25);
    }

    /* CATEGORIES */
    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .cat-card {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: white;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }

    .cat-card:hover {
      transform: translateY(-3px) scale(1.04);
    }

    /* CONTENT */
    .content {
      display: none;
      margin-top: 10px;
      animation: fade 0.3s ease;
    }

    .content h2 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #555;
    }

    .link {
      display: block;
      text-decoration: none;
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      color: white;
      padding: 12px;
      border-radius: 14px;
      margin: 8px 0;
      font-size: 14px;
      transition: 0.3s;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .link:hover {
      transform: translateY(-2px) scale(1.03);
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 22px;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<script>
  const contents = document.querySelectorAll(".content");
  const searchInput = document.getElementById("search");

  // SEMUA HIDDEN DI AWAL
  contents.forEach(c => c.style.display = "none");

  function showCategory(category) {
    searchInput.value = "";

    contents.forEach(content => {
      content.style.display =
        content.dataset.category === category ? "block" : "none";
    });
  }

  function searchProduct() {
    const keyword = searchInput.value.toLowerCase();

    contents.forEach(content => {
      let match = false;
      const links = content.querySelectorAll(".link");

      links.forEach(link => {
        if (link.innerText.toLowerCase().includes(keyword)) {
          link.style.display = "block";
          match = true;
        } else {
          link.style.display = "none";
        }
      });

      if (keyword === "") {
        content.style.display = "none";
      } else {
        content.style.display = match ? "block" : "none";
      }
    });
  }
</script>
