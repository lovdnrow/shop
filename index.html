<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>✨🇩​​🇳​​🇷​​🇴​​🇼​​🇸​​🇭​​🇴​​🇵​✨</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 30px 0;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 25px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    p {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      margin-bottom: 20px;
      font-family: inherit;
    }

    .category {
      margin-bottom: 25px;
    }

    .category h2 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #555;
    }

    .link {
      display: block;
      text-decoration: none;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: white;
      padding: 12px;
      border-radius: 14px;
      margin: 8px 0;
      font-size: 14px;
      transition: 0.3s;
    }

    .link:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🌸 lovdnrow 🌸</h1>
  <p>Find my products easily ✨</p>

  <!-- SEARCH -->
  <input type="text" id="search" placeholder="🔍 Cari produk..." onkeyup="searchLinks()">

  <!-- FASHION -->
  <div class="category">
    <h2>👗 Fashion</h2>
    <a class="link" href="https://s.shopee.co.id/30i8cLg5Ne" data-name="Whispie" data-category="fashion">🌸 Kemaja Whispie</a>
    <a class="link" href="https://s.shopee.co.id/14X2uGdID" data-name="Daisy" data-category="fashion">🌸 Kemeja Daisy</a>
  </div>

  <!-- FOOD -->
  <div class="category">
    <h2>🌸 Jedai</h2>
    <a class="link" href="https://s.shopee.co.id/10x4EWRLit" data-name="Jedai Kamboja" data-category="Jedai">🔥 Jedai Kamboja</a>
    <a class="link" href="https://s.shopee.co.id/BNxF2yB15" data-name="Jedai Anggrek" data-category="Jedai">🔥 Jedai Anggrek</a>
  </div>

  <footer>made with 💖</footer>
</div>

<script>
function searchLinks() {
  const input = document.getElementById("search").value.toLowerCase();
  const links = document.querySelectorAll(".link");
  const categories = document.querySelectorAll(".category");

  links.forEach(link => {
    const name = link.dataset.name.toLowerCase();
    link.style.display = name.includes(input) ? "block" : "none";
  });

  categories.forEach(category => {
    const visibleLinks = category.querySelectorAll('.link[style="display: block"]');
    category.style.display = visibleLinks.length ? "block" : "none";
  });
}
</script>

</body>
</html>
