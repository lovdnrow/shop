<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>✨🇩🇳🇷🇴🇼🇸🇭🇴🇵✨</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    input {
  width: 100%;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid #ddd;
  margin-bottom: 20px;
  font-family: inherit;
}

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 30px 0;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 25px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    p {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* CATEGORY BOX */
    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .cat-card {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: white;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    .cat-card:hover {
      transform: scale(1.05);
    }

    /* CONTENT */
    .content {
      display: none;
      margin-top: 15px;
    }

    .content h2 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #555;
    }

    .link {
      display: block;
      text-decoration: none;
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      color: white;
      padding: 12px;
      border-radius: 14px;
      margin: 8px 0;
      font-size: 14px;
      transition: 0.3s;
    }

    .link:hover {
      transform: scale(1.04);
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <input type="text" id="search" placeholder="🔍 Cari produk..." onkeyup="searchProducts()">

<div class="card">
  <h1>🌸 lovdnrow 🌸 </h1>
  <p>Pilih kategori produk ✨</p>

  <!-- CATEGORY BOX -->
  <div class="categories">
    <div class="cat-card" onclick="showCategory('fashion')">👗 Fashion</div>
    <div class="cat-card" onclick="showCategory('jedai')">🌸 Jedai</div>
  </div>

  <!-- CONTENT -->
  <div id="fashion" class="content">
    <h2>👗 Fashion</h2>
    <a class="link" href="https://s.shopee.co.id/30i8cLg5N" target="_blank">🌸 Whispie</a>
    <a class="link" href="https://s.shopee.co.id/14X2uGdID" target="_blank">🧶 Daisy</a>
  </div>

  <div id="jedai" class="content">
    <h2>🌸 Jedai</h2>
    <a class="link" href="https://s.shopee.co.id/10x4EWRLit" target="_blank">✨ Bunga Kamboja</a>
    <a class="link" href="https://s.shopee.co.id/BNxF2yB15" target="_blank">🫧 Bunga Anggrek</a>
  </div>

  <footer>made with 💖</footer>
</div>

<script>
function showCategory(id) {
  document.querySelectorAll('.content').forEach(c => {
    c.style.display = 'none';
  });

  document.getElementById(id).style.display = 'block';
}
</script>

  <script>
function showCategory(id) {
  document.querySelectorAll('.content').forEach(c => {
    c.style.display = 'none';
  });
  document.getElementById(id).style.display = 'block';
}

function searchProducts() {
  const keyword = document.getElementById("search").value.toLowerCase();
  const contents = document.querySelectorAll(".content");

  contents.forEach(content => {
    let found = false;
    const links = content.querySelectorAll(".link");

    links.forEach(link => {
      const text = link.innerText.toLowerCase();
      if (text.includes(keyword)) {
        link.style.display = "block";
        found = true;
      } else {
        link.style.display = "none";
      }
    });

    content.style.display = found ? "block" : "none";
  });
}
</script>

</body>
</html>
