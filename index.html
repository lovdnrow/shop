<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>✨🇩🇳🇷🇴🇼🇸🇭🇴🇵✨</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>/* RESET KECIL */
* {
  box-sizing: border-box;
}

/* BODY */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 30px 0;
}

/* CARD UTAMA */
.card {
  background: white;
  padding: 25px;
  border-radius: 25px;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

/* JUDUL */
h1 {
  text-align: center;
  margin-bottom: 5px;
  font-size: 24px;
}

/* SUBTITLE */
p {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 18px;
}

/* SEARCH INPUT */
input {
  width: 90%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid #ddd;
  margin: 0 auto 22px auto;
  display: block;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-color: #f2a6c9;
  box-shadow: 0 0 0 3px rgba(242, 166, 201, 0.25);
}

/* KOTAK KATEGORI */
.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}

/* CARD KATEGORI */
.cat-card {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  color: white;
  padding: 18px 10px;
  border-radius: 18px;
  text-align: center;
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 8px 18px rgba(0,0,0,0.15);
}

.cat-card:hover {
  transform: translateY(-3px) scale(1.04);
}

/* ISI KATEGORI */
.content {
  display: none;
  margin-top: 10px;
  animation: fade 0.3s ease;
}

/* JUDUL ISI */
.content h2 {
  font-size: 16px;
  margin-bottom: 10px;
  color: #555;
}

/* LINK PRODUK */
.link {
  display: block;
  text-decoration: none;
  background: linear-gradient(135deg, #a18cd1, #fbc2eb);
  color: white;
  padding: 12px 14px;
  border-radius: 14px;
  margin: 8px 0;
  font-size: 14px;
  transition: 0.3s;
  box-shadow: 0 6px 14px rgba(0,0,0,0.15);
}

.link:hover {
  transform: translateY(-2px) scale(1.03);
}

/* FOOTER */
footer {
  text-align: center;
  font-size: 12px;
  color: #aaa;
  margin-top: 22px;
}

/* ANIMASI HALUS */
@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* RESPONSIVE EXTRA KECIL */
@media (max-width: 360px) {
  h1 {
    font-size: 22px;
  }

  .cat-card {
    font-size: 13px;
    padding: 16px 8px;
  }
}
</style>
</head>
<body>

<div class="card">
  <h1>🌸 lovdnrow 🌸 </h1>
  <p>Pilih kategori produk ✨</p>

  <input type="text" id="search" placeholder="🔍 search..." onkeyup="searchProducts()">

  <!-- CATEGORY BOX -->
  <div class="categories">
    <div class="cat-card" onclick="showCategory('fashion')">👗 Fashion</div>
    <div class="cat-card" onclick="showCategory('jedai')">🌸 Jedai</div>
  </div>

  <!-- CONTENT -->
  <div id="fashion" class="content">
    <h2>👗 Fashion</h2>
    <a class="link" href="https://s.shopee.co.id/30i8cLg5N" target="_blank">🌸 Whispie</a>
    <a class="link" href="https://s.shopee.co.id/14X2uGdID" target="_blank">🧶 Daisy</a>
  </div>

  <div id="jedai" class="content">
    <h2>🌸 Jedai</h2>
    <a class="link" href="https://s.shopee.co.id/10x4EWRLit" target="_blank">✨ Bunga Kamboja</a>
    <a class="link" href="https://s.shopee.co.id/BNxF2yB15" target="_blank">🫧 Bunga Anggrek</a>
  </div>

  <footer>made with 💖</footer>
</div>

  <script>
function showCategory(id) {
  document.querySelectorAll('.content').forEach(c => {
    c.style.display = 'none';
  });
  document.getElementById(id).style.display = 'block';
}

function searchProducts() {
  const keyword = document.getElementById("search").value.toLowerCase();
  const contents = document.querySelectorAll(".content");

  contents.forEach(content => {
    let found = false;
    const links = content.querySelectorAll(".link");

    links.forEach(link => {
      const text = link.innerText.toLowerCase();
      if (text.includes(keyword)) {
        link.style.display = "block";
        found = true;
      } else {
        link.style.display = "none";
      }
    });

    content.style.display = found ? "block" : "none";
  });
}
</script>

</body>
</html>
